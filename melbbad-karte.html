const TXT = {
 ist:'Geschlossenes Bad, ungel&ouml;stes Starkregenrisiko: Das Kerbtal (Flanken +60 m) leitet Fluten ungebremst ins 25&ndash;30 m tiefere Poppelsdorf &ndash; die Verrohrung ist der Engpass. 2020 zerst&ouml;rte genau das die Badtechnik.',
 soll:'See = freie Badestelle ohne Aufsichtspflicht; nur das separate Sprungbecken ist eingez&auml;unt und &ouml;ffnet bei DLRG-Wache. Regeneration im Nordbecken, Nordwiese als Retention vor der Drossel. Beachfelder bleiben, Nachbarn unber&uuml;hrt &ndash; halber Invest, Poppelsdorf gesch&uuml;tzt.'
};
let MODE='ist';
function syncTech(){
  const on = document.getElementById('chkTech').checked && MODE==='soll';
  if(on){ tech.addTo(map); } else { map.removeLayer(tech); }
}
function setMode(m){
  MODE=m;
  document.getElementById('btnIst').className = m==='ist'?'active-ist':'';
  document.getElementById('btnSoll').className = m==='soll'?'active-soll':'';
  document.getElementById('techlabel').style.display = m==='soll'?'inline-block':'none';
  if(m==='ist'){ map.removeLayer(soll); ist.addTo(map);} else { map.removeLayer(ist); soll.addTo(map);}
  legbody.innerHTML = LEG[m]; modetext.innerHTML = TXT[m];
  syncTech();
}
setMode('ist');
map.fitBounds(L.geoJSON(GEO_BAD).getBounds().pad(1.2));
